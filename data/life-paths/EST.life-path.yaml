# Estonia life-path spec (stats-first draft)
# Filled for review. Story flair intentionally plain — edit freely.
# Primary year for weights: 2024 live births / mothers (unless noted).
# Counts re-verified against Stat EE + TAI PX-Web APIs on 2026-07-25.

schema_version: 1

meta:
  iso3: "EST"
  country_name: "Estonia"
  language: "en"
  updated: "2026-07-25"
  author: "cursor-agent (stats draft for human flair pass)"
  notes: >
    Birth-weighted distributions from Statistics Estonia and TAI.
    Socioeconomic start uses mother's educational level at birth (RV142U),
    which is the right prior for a newborn — not the adult population education mix.
    Tallinn is split out of Harju county using RV11U sub-row 784.
    Mother nationality and country-of-birth are available as fact variables but are
    NOT in the default birth template (avoid essentializing ethnicity in the opener).
    Later-life event pools are mostly color stubs for the flair pass;
    birth variables are fact-backed and should stay stable.

voice:
  person: "second"
  tense: "past"
  tone: "concrete"
  max_sentence_length: 28
  style_rules:
    - "No jargon (no 'modal path', 'quintile', 'stratum' in player text)"
    - "No life-expectancy numbers inside the story (those belong in About)"
    - "Prefer places, ages, and actions over abstract categories"
    - "Keep fact-tagged lines numerically honest even after flair edits"
  hard_nos:
    - "Do not invent county birth shares"
    - "Do not imply that color events are nationally representative"
    - "Avoid stigmatizing whole regions or ethnic groups"
    - "Do not put nationality/ethnicity into the birth opener by default"

