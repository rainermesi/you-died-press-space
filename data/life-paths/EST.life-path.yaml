# ---------------------------------------------------------------------------
# LLM IMPLEMENTATION BRIEF
# ---------------------------------------------------------------------------
llm_brief:
  goal: >
    Implement a life-path generator for Estonia that rolls the fact variables
    from this file, walks beats until age-at-death, and composes text from
    templates + pools. Wire class_level to existing education strata in
    data/countries/EST.json.
  must:
    - "Keep 2024 weights unless updating with a newer cited year"
    - "Reuse vocab/pack stratum ids: below-upper-secondary, upper-secondary, tertiary"
    - "Honor fact vs color tags"
    - "Cite RV11U, RV106, RV142U, RV115, SR55 (and RV033 as cross-check) in country pack sources"
    - "Preserve mother-based marital wording unless a better two-parent source is added"
    - "Roll mother_age_group / mother_born_in / mother_nationality but keep them out of birth template by default"
  must_not:
    - "Replace county weights with vibes"
    - "Hardcode only a few full stories per class"
    - "Put nationality into the birth opener without an explicit design decision"
  deliverables:
    - "data/life-paths/EST.life-path.yaml (this file)"
    - "Generator wiring + sample outputs in the PR"
